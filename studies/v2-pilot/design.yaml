# v2 pilot: machine-readable design
# Summary: settings, cells, repeats, frozen bundles, checks, stages, analysis family and the frozen 64-task sample with each task's cells.
# Written 2026-10-30 before any agent run; revised the same day after three reviews (DESIGN.md section 11). Prose: DESIGN.md, PREDICTIONS.md, ANALYSIS.md.
study: amt-v2-pilot
version: '2026-10-30'
status: protocol revised after review (DESIGN.md, Review response); not run; no agent run made
docs:
  design: DESIGN.md
  predictions: PREDICTIONS.md
  analysis: ANALYSIS.md
regenerate: python3 scripts/probe/breakingweb/pilot_plan.py all /tmp/amt-syn/pilot (BreakingWeb venv python)
environment:
  name: BreakingWeb
  checkout: ~/.workspace/_refsrc/BreakingWeb
  release: 052f0f0
  browser: Chromium 125.0.6422.26 (Playwright 1.44)
  bind: 127.0.0.1 only
  license: none; local research use only
  remote_requests: aborted in every arm
  page_date: fixed at load (DATE_SHIM as replay.py)
  seed: backend default per session
models:
- id: us.anthropic.claude-opus-5-5
  region: us-west-2
  reasoning: adaptive thinking, effort medium, passed by the H1 wrapper and recorded per call (cannot be disabled)
  temperature: null
- id: us.openai.gpt-5.6-sol
  region: us-east-2
  reasoning: Bedrock default reasoning effort, value recorded per call by the H1 wrapper
  temperature: null
aws_profile: codex-DO-NOT-DELETE
model_rule: only Anthropic and OpenAI GPT-5.6 models on the codex-DO-NOT-DELETE Bedrock profile; never Gemini, Qwen or other providers; published
  Gemini trajectories used only as recorded reference solutions
harnesses:
  bg:
    name: BrowserGym AXTree text
    code: 'breakingweb/agent.py LLMAgent through scripts/probe/breakingweb/h1_wrapper.py (to be written in Stage 0; sha256 recorded here before
      Stage 0r): passes reasoning effort, maxTokens 16384, logs stopReason, usage, effort sent, summary-call failures; no edit to the clone'
    observation: flatten_axtree_to_str(filter_visible_only=True, filter_with_bid_only=True, with_clickable=True, with_visible=True); text only
    viewport:
    - 1280
    - 720
    actions: one BrowserGym high-level action per step (bid, chat, infeas)
    max_tokens: 16384
    history_trim_est_tokens: 26000
    step_cap: 1.5 * expected_steps (task YAML)
    wall_cap_s: 1800
    yaml_time_limit_used: false
    wrapper_sha256: TBD (Stage 0)
  bu:
    name: stock browser-use 0.13.14
    code: breakingweb/stock_browseruse_eval.py run_episode, provider bedrock
    use_vision: true
    viewport:
    - 1024
    - 768
    max_steps: 60
    timeout_s: 1200
    max_actions_per_step: 4
    envs:
    - amazon
    - gmail
    - patient_portal
    kinds:
    - names
    viewport_note: 1024x768 for every Bedrock model (stock_browseruse_eval.py:946-948); footprint recaptured at 1024x768 in Stage 0
kinds:
  landmarks:
    envs: all
  headings:
    envs: all
  names:
    envs: all
    note: aria-label/aria-labelledby removed on every element with an interactive role (codemod widened in Stage 0 if the pre-run residual count
      is above 0)
  labels:
    envs: all
    note: removes the control's computed name from both sources (label association and control aria-label); label click no longer focuses its
      control (37 labels); kept as part of the defect
  alt:
    envs:
    - amazon
    note: no <img> in gmail, lms, patient_portal, reddit, robinhood (identical bundle); booking alt failed the variant gate
  tableheads:
    envs:
    - gmail
    - lms
    - patient_portal
    - booking
    - robinhood
    note: booking and robinhood cells only after the task-path gate M2
cells:
  clean:
    type: baseline
    build: clean
    repeats:
      bg: 6
      bu: 5
    screening_runs: 2
    tasks: all sample
  none:
    type: negative control
    build: codemod none (byte-identical to clean), served from its own checkout, backend process and 127.0.0.1 port, started and restarted on
      the variant schedule
    repeats:
      bg: 3
      bu: 3
    tasks: all sample
  kind:
    type: treatment
    build: codemod <kind>
    repeats:
      bg: 3
      bu: 3
    tasks: on-path (primary flag) tasks in kind envs; no off-path cells
  names+:
    type: information control (add-back)
    layer: observation, on the names_tagged build (the names build with each removed aria-label/aria-labelledby kept as data-amt-label/data-amt-labelledby,
      which is not in the accessibility tree); the H1 wrapper reads the data attributes by bid after each observation
    rule: 'on every observation line whose element (bid) carries data-amt-label(ledby), the name is set to that value (the clean name, evaluated
      by the same template at run time); every other line (StaticText exposed by the variant, structure, order) kept from the variant; M3: names_tagged
      H1 observation byte-identical to names on every replay state, and the restored names equal the clean names'
    repeats:
      bg: 3
    tasks: names on-path (primary)
  names50:
    type: dose / graded control
    layer: observation, on the names_tagged build (the names build with each removed aria-label/aria-labelledby kept as data-amt-label/data-amt-labelledby,
      which is not in the accessibility tree); the H1 wrapper reads the data attributes by bid after each observation
    rule: 'names+ applied to a seeded half of the changed elements: restore iff sha256(task|bid|amt-v2-names50) is even'
    repeats:
      bg: 3
    tasks: names on-path (strict)
  labels~:
    type: sham
    build: 'codemod labels_sham: htmlFor removed as in labels; aria-labelledby to the label on controls without aria-label; control aria-labels
      kept verbatim; gated like a kind (variant_gate, click_effect, replay 3/3, do-nothing) before Stage 1'
    repeats:
      bg: 3
    tasks: labels on-path
    bundle_sha256_prefix: TBD (Stage 0)
  machinery_shams:
    type: sham, checked not run
    build: headings->div role=heading aria-level; landmarks->div explicit role+label; th->td role=columnheader/rowheader
    rule: H1 observation byte-identical to clean on every replay state (MH5)
  pos_info:
    type: positive control
    layer: observation (clean build)
    rule: interactive elements keep role and bid, lose name; StaticText inside them dropped
    repeats:
      bg: 2
    tasks:
    - amazon_add_single_item
    - amazon_browse_category
    - amazon_full_account_setup
    - amazon_multi_destination_orders
    - amazon_stale_wishlist_refresh
    - booking_cancel_and_message
    - booking_reply_to_hotel
    - booking_saved_list_to_booking
    - gmail_create_label
    - gmail_diagnose_missing_reply
    - gmail_search_and_star
    - gmail_star_email
    - lms_check_assignment_grade
    - lms_find_missing_assignments
    - lms_late_assignment_worth
    - pp_full_care_transition
    - pp_message_correct_provider
    - pp_preventive_screening_review
    - pp_prior_auth_marathon
    - reddit_save_comments
    - reddit_search_and_message
    - rh_cancel_pending_order
    - rh_deposit_funds
    - rh_mark_notifications_read
  pc_break:
    type: exploratory functional-break anchor (not a must-hold)
    build: click_effect.py pc_break
    repeats:
      bg: 2
    tasks:
    - amazon_buy_highest_rated
    - amazon_delivered_review_chain
    - amazon_duplicate_order_cleanup
    - amazon_multi_destination_orders
    - amazon_price_comparison
    - amazon_stale_wishlist_refresh
    - booking_account_security_and_payment
    - booking_book_family_room
    - booking_delete_saved_list
    - booking_find_deal_and_book
    - booking_modify_and_message
    - booking_modify_dates
    - booking_save_property
    - booking_saved_list_to_booking
    - booking_settings_overhaul
    - gmail_forward_email
    - lms_check_assignment_grade
    - lms_find_missing_assignments
    - lms_late_assignment_worth
    - pp_refill_prescription
    - reddit_notification_driven_workflow
    - reddit_notification_triage
    - reddit_subscribe_subreddit
    - rh_sell_shares
  do_nothing:
    type: negative control
    llm: false
    repeats: 1
    tasks: every task x build
  fmt_wrap:
    type: format control
    layer: observation (clean build)
    rule: 'under each landmark line that the landmarks variant removes on the same state, insert one nameless `generic` line without bid and indent
      the landmark''s subtree one more level: the same lines change indentation (by +1 instead of -1), line count changes by +k instead of -k,
      landmark lines and containment kept; unit-tested on 20 saved observations (M3)'
    repeats:
      bg: 3
    tasks: all sample
