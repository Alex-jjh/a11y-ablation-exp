checks:
  M1: served bundle hash equals bundles_sha256_prefix; else run excluded and rerun
  M2: variant-gate rules (DOM, pixel, layout, console, observation) plus the residual count on every replay state of each sample task and every
    static route, every kind and sham build; fail -> (task, cell) excluded before any agent run
  M2a: 'variant_check.py with the frozen codemod on the 70-task stratified sample: names and labels agreement >= 98% each; else no names/labels
    run'
  M2b: 'exposure from real variants: replay every sample task on the frozen variant bundles, record each acted-on element''s AX name in clean
    and variant, derive on_primary/on_strict; agreement with the simulated flags >= 98% or the real-variant flags replace them (before Stage 1)'
  M3: 'delivery: names+ restored lines equal clean names and nothing else differs from the variant; names50 restores exactly the seeded half;
    labels~ computed name equals clean; machinery shams obs identical; fmt_wrap and pos_info unit tests on 20 observations'
  M3a: labels~ and names_tagged pass variant_gate.py, click_effect.py, replay.py 3/3 and do-nothing before Stage 1; hashes recorded
  M4: 'per-step DOM residual probe (every element of the kind, including any interactive role with aria-label for names); logged, never a per-run
    exclusion; a residual in any run makes the (env, build) a delivery defect: codemod fixed, bundle rebuilt and re-gated, every run of that build
    rerun (numbered deviation); the original runs analysed as assigned as a sensitivity analysis'
  M5: realised exposure per run; never an exclusion; agreement with assigned exposure computed on clean and none runs only
  M6: 'function-equivalence and replay verdicts (applied: booking alt out, booking_profile_update_suite out)'
  M7: stop reason, refusal, truncation, throttling, usage and effort sent, per call, from the H1 wrapper; API errors after 5 retries = infra failure
  M8: infra failure -> rerun up to 2 times, then missing; flag cell if >5% missing; bounds analysis (missing as failure, as success) for any cell
    with missing runs
  M9: do-nothing must fail; else task leaves that cell
  M10: 'H1 action feasibility: for each reference action, the clicked element or an ancestor/descendant with the same click effect has a bid in
    the variant H1 observation of that replay state; tasks failing it for a kind leave that kind''s confirmatory test (PC3-PC6) and are reported
    as a knock-on subset'
admission:
  rule: '>=1 of 2 screening clean runs succeed, per model and harness'
  screening_runs_reused_as_baseline: false
  change_rule: 'any change to reasoning setting or step cap after Stage 1 voids Stage 1: new screening runs, new admission list'
selection:
  rule: "(fixed 2026-10-30, before any agent run; DESIGN.md section 5)\n  pool   = replay reference set (3/3 clean replays, do-nothing fails)\n\
    \           AND not hardened AND panel tier A (4-6 of 6 published panel models solved)\n           AND no 'unstable' verdict in any replay\
    \ cell\n  sample = all pool tasks on-path for tableheads (primary flag), then a stratified\n           random fill by env to N_PILOT, quota\
    \ proportional to the env's remaining\n           pool, at least 3 per env (or all if fewer); RNG seeded with\n           sha256(\"amt-v2-pilot-2026-10-30\"\
    ); within an env, tasks are drawn in\n           the RNG's shuffle of the sorted task ids.\n  sealed = pool minus sample (no study-model run\
    \ on them until the main study)."
  seed_text: amt-v2-pilot-2026-10-30
  pool_n: 152
  sample_n: 64
  sealed_n: 88
  sealed_tasks: 'select.json: sealed_tasks'
  excluded_unstable:
  - booking_profile_update_suite
stages:
- '0: builds and gates (M2, M2a, M2b, M3, M10, labels~ gates), codemod frozen and hashed, H1 wrapper, probes, driver, browser-use footprint at
  1024x768, simulated-outcome validation on exact strata; dated literature search and close-reads of A11y-CUA and Ersoy2025; licence request to
  the BreakingWeb authors (no LLM)'
- '0r: registration: PREDICTIONS.md, ANALYSIS.md, design.yaml frozen, sha256 published with a trusted timestamp (Alex)'
- '0s: smoke, 4 tier-B tasks outside the pool, 32 runs, not analysed; truncation rate, tokens, latency, summary-call success per model'
- '0c: only cost, quotas, concurrency, maxTokens (if truncation > 2%), Bedrock region and GPT price may change; anything else is a numbered deviation'
- '1: screening clean c1-c2 -> admission frozen'
- '2: all other runs, day-blocked by task, seeded random order within block'
- '3: analysis as registered'
stopping:
- 'rolling window of the last 200 Stage-2 runs with >5% infra or call failures: stop and fix; the fixer sees pooled counts only; fix logged as
  a timestamped deviation; runs passing M1 kept; before/after-fix slot is a sensitivity covariate'
- 'Stage 0s: >2% of calls truncated at maxTokens: stop for Alex'
- 'model screening clean success <30%: stop for Alex'
- 'running cost >1.5x estimate: stop for Alex'
- 'any do-nothing pass in a running cell: stop that cell'
- no stopping on variant outcomes; no variant result read before stage 3
analysis:
  estimand: paired drop per task, clean baseline minus cell, probability scale, task-weighted mean over admitted tasks
  primary_interval: paired task bootstrap, 10000 draws, percentile; strata = envs with >= 5 tasks in the cell, the other envs merged into one
    stratum (into the smallest stratum if the merged one has < 5); joint draws across cells; t(G-1) interval beside it; if the Stage-0 coverage
    simulation on the cell's exact strata gives < 92%, the unstratified bootstrap is primary for that cell
  variance_components: 'per kind: glmm success ~ cell + env + (1|task) + (1|task:cell) on clean plus that kind''s cells, per model and harness;
    parametric bootstrap intervals; power simulation at the estimate and the 80th percentile (capped at tau 1.0)'
  band: 'per cell, descriptive: random splits of the clean-bundle runs (4 baseline + 3 none in H1) into the cell''s repeat counts, on the cell''s
    own task set, bootstrap as the primary interval; none pooled by design'
  family_F1:
    tests:
    - PC1 names strict Opus
    - PC2 names strict GPT
    test: 'one-sided bootstrap, H1: drop > 0'
    correction: Holm
    alpha: 0.05
    grading: hit if Holm rejects; miss if the upper 95% bound < 10; else unresolved
  must_hold:
  - 'MH1 none vs clean: two-sided test at 0.05 does not reject (sensitivity stated)'
  - MH2 do-nothing 0
  - 'MH3 pos_info: one-sided test rejects 0 at 0.05'
  - MH5 machinery shams obs identical
  must_hold_alpha: 0.05
  exploratory: everything else, unadjusted 95% intervals, per-cell band; decisions of ANALYSIS.md section 8 tied to named contrasts
  equivalence_F2:
    tests:
    - PC3 landmarks Opus
    - PC4 landmarks GPT
    - PC5 headings Opus
    - PC6 headings GPT
    test: TOST against a 10-point margin by the 90% interval
    correction: none (each a separate claim; the joint claim is an intersection-union test)
    grading: hit if the upper 90% bound < 10; miss if the lower 90% bound > 10; else unresolved
  secondary_outcomes:
  - success without a step-cap or truncation failure
  - steps to success
  - step-cap hits, truncations, wall-cap hits per cell
  - first step where a run diverges from every clean run of the task
  - wrong-target clicks among the ambiguous set (names strict)
  - observation tokens per step and history-trim step
  task_dose_covariate: lines and tokens changed between clean and variant H1 observations over the task's replay states (pre-treatment)
  contrasts_population: models and harnesses compared on the intersection of admitted tasks (primary)
